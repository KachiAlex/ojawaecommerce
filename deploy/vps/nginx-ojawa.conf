# /etc/nginx/sites-available/ojawa
# Ojawa on VPS: static frontend + /api + /uploads proxied to the ojawa-app container (127.0.0.1:8090)

server {
    listen 80;
    server_name ojawa.africa www.ojawa.africa;

    root /var/www/ojawa/frontend/dist;
    index index.html;

    # Security headers (ported from the old firebase.json CSP, minus Firebase/Vercel)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), fullscreen=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.paystack.co https://checkout.flutterwave.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: blob:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; connect-src 'self' https://api.mapbox.com https://events.mapbox.com https://router.project-osrm.org https://nominatim.openstreetmap.org https://api.paystack.co https://api.flutterwave.com https://accounts.google.com; frame-src 'self' https://accounts.google.com https://js.paystack.co https://checkout.paystack.com https://checkout.flutterwave.com https://*.flutterwave.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    client_max_body_size 20m;

    # Long-cache static assets
    location ~* \.(?:jpg|jpeg|gif|png|svg|webp|ico|woff|woff2|ttf|eot|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Content-Type "application/javascript";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API -> ojawa-app container
    location /api {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }

    # Legacy backend auth routes mounted at root by app.use('/', authRoutes).
    # Only paths that are NOT React SPA routes (login/register/profile/etc. must serve index.html).
    location ~ ^/(signin|signup|signout|logout|refresh|me|fix-email|sendEmailOTP|verifyEmailOTP|change-password|change-email)(/|$|\?) {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded files served by the backend (product images, messaging attachments)
    location /uploads {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
    }

    location /health {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
